<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.role-list.title})}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">
        <h1 th:text="#{msg.role-list.title}"></h1>
        <a th:href="@{/roles/new}" class="btn btn-success" th:text="#{msg.role-list.add}"></a>

        <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-danger mt-3"></div>
        <div th:if="${successMessage}" th:text="${successMessage}" class="alert alert-success mt-3"></div>

        <table class="table table-bordered table-striped mt-3 align-middle">
            <thead>
            <tr>
                <th th:text="#{msg.role-list.id}"></th>
                <th th:text="#{msg.role-list.name}"></th>
                <th th:text="#{msg.role-list.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(listRoles)}">
                <td colspan="3" class="text-center text-muted" th:text="#{msg.role-list.empty}"></td>
            </tr>
            <tr th:each="r : ${listRoles}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.name}"></td>
                <td class="text-nowrap">
                    <a th:href="@{/roles/detail(id=${r.id})}" class="btn btn-info btn-sm"
                       th:text="#{msg.role-list.detail}"></a>
                    <a th:href="@{/roles/edit(id=${r.id})}" class="btn btn-primary btn-sm"
                       th:text="#{msg.role-list.edit}"></a>
                    <form th:action="@{/roles/delete}" method="post" class="d-inline"
                          th:attr="data-confirm=#{msg.role-list.confirm}"
                          onsubmit="return confirm(this.dataset.confirm);">
                        <input type="hidden" name="id" th:value="${r.id}">
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:text="#{msg.role-list.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.role-form.returnback}"></a>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
