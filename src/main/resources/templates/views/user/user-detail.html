<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.user-detail.title})}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card form-card-wide">
        <h1 th:text="#{msg.user-detail.title}"></h1>

        <dl class="row mt-3">
            <dt class="col-sm-5" th:text="#{msg.user-list.id}"></dt>
            <dd class="col-sm-7" th:text="${user.id}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.username}"></dt>
            <dd class="col-sm-7" th:text="${user.username}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.active}"></dt>
            <dd class="col-sm-7" th:text="${user.active} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.accountNonLocked}"></dt>
            <dd class="col-sm-7" th:text="${user.accountNonLocked} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.lastPasswordChange}"></dt>
            <dd class="col-sm-7" th:text="${#temporals.format(user.lastPasswordChange, 'dd/MM/yyyy HH:mm')}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.passwordExpiresAt}"></dt>
            <dd class="col-sm-7" th:text="${#temporals.format(user.passwordExpiresAt, 'dd/MM/yyyy HH:mm')}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.failedLoginAttempts}"></dt>
            <dd class="col-sm-7" th:text="${user.failedLoginAttempts}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.emailVerified}"></dt>
            <dd class="col-sm-7" th:text="${user.emailVerified} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.mustChangePassword}"></dt>
            <dd class="col-sm-7" th:text="${user.mustChangePassword} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.roles}"></dt>
            <dd class="col-sm-7">
                <span th:each="r : ${user.roles}" class="badge text-bg-secondary me-1" th:text="${r.name}"></span>
                <span th:if="${#lists.isEmpty(user.roles)}" class="text-muted" th:text="#{msg.user-detail.roles.none}"></span>
            </dd>
        </dl>

        <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary" th:text="#{msg.user-list.edit}"></a>
        <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}"></a>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
