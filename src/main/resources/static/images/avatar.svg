<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Avatar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="circle">
      <circle cx="20" cy="20" r="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <!-- Fondo -->
    <rect width="40" height="40" fill="#cfe2ff"/>
    <!-- Hombros -->
    <ellipse cx="20" cy="38" rx="15" ry="12" fill="#0d6efd"/>
    <!-- Cabeza -->
    <circle cx="20" cy="15" r="7" fill="#0d6efd"/>
  </g>
</svg>
